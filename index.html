<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1e; color: white; text-align: center; padding: 40px 20px; }
        button { background: #007aff; color: white; border: none; padding: 18px 30px; font-size: 18px; border-radius: 12px; margin-top: 30px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Сканер штрих-кодов</h2>
    <p>Нажми на кнопку ниже, чтобы запустить встроенную камеру Telegram</p>
    
    <button id="scanBtn">📸 Включить камеру</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('scanBtn').addEventListener('click', () => {
            // Вызываем официальный нативный сканер Телеграма
            tg.showScanQrPopup({ text: "Наведи камеру на штрих-код шайбы" }, function(text) {
                // Как только код считан — отправляем его боту и закрываем окно
                tg.sendData(text);
                tg.closeScanQrPopup(); // закрываем шторку сканера
                tg.close(); // закрываем само WebApp
                return true;
            });
        });
    </script>
</body>
</html>
